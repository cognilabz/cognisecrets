name: Release
run-name: Release ${{ github.event.inputs.version || 'next patch version' }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Semantic version to publish, for example 0.1.1. Leave empty to auto-increment from the latest vX.Y.Z tag, starting at 0.1.1."
        required: false
        type: string

permissions:
  contents: write
  packages: write

jobs:
  release:
    name: Publish image and manifest
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve release version
        id: version
        shell: bash
        env:
          REQUESTED_VERSION: ${{ github.event.inputs.version }}
        run: |
          set -euo pipefail

          requested="$(printf '%s' "${REQUESTED_VERSION:-}" | xargs)"
          latest=""
          if [[ -n "${requested}" ]]; then
            if [[ ! "${requested}" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              printf 'version must be a semantic version like 0.1.1 or v0.1.1\n' >&2
              exit 1
            fi
            semver="${requested#v}"
          else
            latest="$(
              git tag -l 'v[0-9]*.[0-9]*.[0-9]*' |
                grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' |
                sed 's/^v//' |
                sort -V |
                tail -n 1 ||
                true
            )"
            if [[ -z "${latest}" ]]; then
              semver="0.1.1"
            else
              IFS=. read -r major minor patch <<<"${latest}"
              semver="${major}.${minor}.$((patch + 1))"
            fi
          fi

          tag="v${semver}"
          latest_tag="<none>"
          if [[ -n "${latest}" ]]; then
            latest_tag="v${latest}"
          fi
          if git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
            printf 'release tag %s already exists\n' "${tag}" >&2
            exit 1
          fi

          {
            printf 'semver=%s\n' "${semver}"
            printf 'tag=%s\n' "${tag}"
          } >>"${GITHUB_OUTPUT}"

          {
            printf '### Release version\n\n'
            printf '%s\n' "- Requested version: \`${requested:-<auto>}\`"
            printf '%s\n' "- Latest release tag used: \`${latest_tag}\`"
            printf '%s\n' "- Resolved version: \`${tag}\`"
          } >>"${GITHUB_STEP_SUMMARY}"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.5"
          cache: true

      - name: Install local tools
        run: make tools

      - name: Verify generated files
        run: make verify-generate

      - name: Run unit tests
        run: make test

      - name: Render install manifests
        run: make verify-render

      - name: Build manager binary
        run: make build

      - name: Render release manifests
        run: make render IMG=ghcr.io/cognilabz/cognisecrets:${{ steps.version.outputs.tag }}

      - name: Check whitespace
        run: git diff --check

      - name: Commit rendered manifests
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manifests
          if git diff --cached --quiet; then
            printf 'No manifest changes to commit.\n'
            exit 0
          fi
          git commit -m "Render manifests for ${{ steps.version.outputs.tag }}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push controller image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/cognilabz/cognisecrets:${{ steps.version.outputs.tag }}

      - name: Upload rendered manifests
        uses: actions/upload-artifact@v4
        with:
          name: cognisecrets-${{ steps.version.outputs.tag }}-manifests
          path: manifests

      - name: Push release tag
        shell: bash
        run: |
          git tag -a "${{ steps.version.outputs.tag }}" -m "Release ${{ steps.version.outputs.tag }}"
          git push origin "${{ steps.version.outputs.tag }}"
